name: Build Explorer Treemap V0.3 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "disk-treemap-v0.3" ]
    paths:
      - "explorer-treemap/**"
      - ".github/workflows/build-explorer-treemap.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build compact .NET Framework 4.8 EXE
        run: dotnet build explorer-treemap/ExplorerTreemap.csproj -c Release

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "explorer-treemap/bin/Release/net48/ExplorerTreemap.exe" "out/ExplorerTreemap-v0.3.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerTreemap-v0.3-Windows
          path: out/ExplorerTreemap-v0.3.exe
          if-no-files-found: error
