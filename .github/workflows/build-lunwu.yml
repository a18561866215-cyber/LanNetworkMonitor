name: Build LunWu APK

on:
  workflow_dispatch:
  push:
    branches: [ "lunwu" ]
    paths:
      - "lunwu-src.zip"
      - ".github/workflows/build-lunwu.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract LunWu source
        run: |
          rm -rf LunWu _lunwu_extract
          mkdir -p _lunwu_extract
          unzip -q lunwu-src.zip -d _lunwu_extract
          mv _lunwu_extract/LunWuGitHub LunWu
          test -f LunWu/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: LunWu
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp LunWu/app/build/outputs/apk/debug/app-debug.apk "out/LunWu-v0.1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunWu-APK
          path: "out/LunWu-v0.1-debug.apk"
          if-no-files-found: error
