name: Build LunWu APK

on:
  workflow_dispatch:
  push:
    branches: [ "lunwu" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app_icon.b64 > app/src/main/res/drawable-nodpi/app_icon.jpg
          file app/src/main/res/drawable-nodpi/app_icon.jpg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/轮·舞-v0.1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunWu-APK
          path: "out/轮·舞-v0.1-debug.apk"
          if-no-files-found: error
