name: Build Memory Cleaner Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "memory-cleaner-v0.1" ]
    paths:
      - "memory-cleaner/**"
      - ".github/workflows/build-memory-cleaner.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore memory-cleaner/MemoryCleaner.csproj

      - name: Publish self-contained single EXE
        run: dotnet publish memory-cleaner/MemoryCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out

      - name: Rename EXE
        shell: pwsh
        run: |
          Copy-Item "out/MemoryCleaner.exe" "out/BackgroundProcessCleaner-v0.1.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundProcessCleaner-v0.1-Windows
          path: out/BackgroundProcessCleaner-v0.1.exe
          if-no-files-found: error
